name: Cleanup GHCR image tags

# The build workflow pushes four tags per run: the rolling tag
# (unified-cuda), a dated snapshot (unified-cuda-YYYY-MM-DD) and the same two
# for the rootless variant. The dated tags pin old manifests in the registry
# forever, so without this job every build adds another copy that is never
# released. This job deletes the older ones and keeps the most recent few for
# rollback.
#
# Safety rules:
#   - a manifest that carries the rolling tag is never deleted
#   - the newest KEEP dated manifests are kept (rollback window)
#   - only manifests whose every tag matches the image's own tag names are
#     touched; anything unexpected is skipped
#   - deletion only happens with dry_run=false, so the first runs are safe
#   - a failed delete is reported as a warning; it never fails the workflow
#
# Deleting a manifest releases its layers once the registry garbage-collects
# the unreferenced blobs, which happens some time after the deletion.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      keep:
        description: "How many of the most recent dated images to keep"
        required: false
        default: "5"
      dry_run:
        description: "List only, delete nothing (set false to actually delete)"
        type: boolean
        required: false
        default: true

concurrency:
  group: cleanup-ghcr-tags
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: List and (optionally) delete old dated images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: llama-swap
          KEEP: ${{ github.event.inputs.keep || '5' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == false && '0' || '1' }}
        run: |
          set -uo pipefail

          API_BASE="/user/packages/container/${PACKAGE}"
          if ! gh api --paginate --jq \
              '.[]? | select(type == "object") | {id: .id, name: .name, created_at: .created_at, tags: .metadata.container.tags}' \
              "${API_BASE}/versions" > versions.ndjson 2>api.err; then
              echo "::warning::user-scoped listing failed, trying the owner-scoped endpoint"
              API_BASE="/users/${OWNER}/packages/container/${PACKAGE}"
              gh api --paginate --jq \
                  '.[]? | select(type == "object") | {id: .id, name: .name, created_at: .created_at, tags: .metadata.container.tags}' \
                  "${API_BASE}/versions" > versions.ndjson
          fi

          # One JSON object per line; slurp into a plain list.
          jq -s 'map(select(.id and .name and (.tags | type == "array")))' \
              versions.ndjson > versions.flat.json
          echo "versions listed: $(jq 'length' versions.flat.json)"
          echo "sample entry:"
          jq -c '.[0]' versions.flat.json

          # Keep the rolling tag's manifest and the newest KEEP dated ones.
          # A tag is "ours" only if it matches the image's own tag names.
          jq -r --argjson keep "${KEEP}" '
            def ours: test("^unified-cuda(-rootless)?(-[0-9]{4}-[0-9]{2}-[0-9]{2})?$");
            (map(select(.tags | index("unified-cuda"))) | map(.name)) as $rolling
            | (sort_by(.created_at) | reverse) as $newest
            | ($newest
               | map(select([.tags[] | select(ours)] | length > 0))
               | .[0:$keep] | map(.name)) as $kept
            | $newest[]
            | select([.tags[] | select(ours)] | length == (.tags | length))
            | select((.name as $d | ($rolling | index($d))) == null)
            | select((.name as $d | ($kept | index($d))) == null)
            | "\(.id)\t\(.name)\t\(.tags | join(","))\t\(.created_at)"
          ' versions.flat.json > to_delete.tsv

          echo "candidates for deletion: $(wc -l < to_delete.tsv)"
          cat to_delete.tsv

          if [ "${DRY_RUN}" = "1" ]; then
              echo "dry run: nothing was deleted (re-run with dry_run=false to delete)"
              exit 0
          fi

          while IFS=$'\t' read -r id name tags created; do
              [ -z "${id}" ] && continue
              echo "deleting version ${id} [${tags}] (${created})"
              if ! gh api --method DELETE "${API_BASE}/versions/${id}"; then
                  echo "::warning::could not delete version ${id} [${tags}]"
              fi
          done < to_delete.tsv

          echo "cleanup pass done"
